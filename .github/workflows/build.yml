name: Build Lissio
run-name: Build Lissio (${{ inputs.source }}, ${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source branch to build
        type: choice
        default: main
        options: [main, develop]
      platform:
        description: Desktop runner or Web frontend
        type: choice
        default: windows-2025
        options: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel, all-desktop, web]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CLIENT_PREFIX: ${{ inputs.source == 'develop' && 'client/' || '' }}
  SERVER_OUTPUT: ${{ inputs.source == 'develop' && 'server/target/release' || 'src-tauri/target/release' }}

jobs:
  build:
    name: ${{ inputs.platform == 'web' && 'Web frontend' || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.platform == 'all-desktop' && '["windows-2025","ubuntu-24.04","macos-15","macos-15-intel"]' || format('["{0}"]', inputs.platform == 'web' && 'ubuntu-24.04' || inputs.platform)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/${{ inputs.source }}
          persist-credentials: false

      - name: Check out pinned Codeberg submodules
        if: inputs.source == 'develop'
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$BUILD_PLATFORM" == web ]]; then
            git submodule update --init -- client
          elif ! git submodule update --init --recursive; then
            echo '::error::Unable to fetch a pinned Codeberg submodule. Use main for a desktop build or select web to test the develop frontend.'
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: ${{ env.CLIENT_PREFIX }}pnpm-lock.yaml

      - name: Set up Rust
        if: inputs.platform != 'web'
        run: |
          rustup update stable
          rustup default stable

      - name: Install Tauri system dependencies on Linux
        if: runner.os == 'Linux' && inputs.platform != 'web'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libudev-dev libfuse2t64 patchelf pkg-config

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install client dependencies
        if: inputs.source == 'develop'
        run: pnpm --dir client install --frozen-lockfile

      - name: Build the Web frontend
        if: inputs.platform == 'web'
        run: pnpm build:web

      - name: Build server, CLI and desktop on main
        if: inputs.platform != 'web' && inputs.source == 'main'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm build:all

      - name: Build server, CLI and desktop on develop
        if: inputs.platform != 'web' && inputs.source == 'develop'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # The pinned client defines the Tauri command. The umbrella prepares its sidecar.
        run: |
          pnpm build:server
          pnpm prepare:sidecar:release
          node scripts/local-env.mjs pnpm --dir client exec tauri build --config src-tauri/tauri.local.conf.json
          node scripts/local-env.mjs node scripts/finalize-bundles.mjs

      - name: Upload desktop installers
        if: inputs.platform != 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lissio-desktop-${{ inputs.source }}-${{ matrix.runner }}
          path: |
            ${{ env.CLIENT_PREFIX }}src-tauri/target/release/bundle/**/*.AppImage
            ${{ env.CLIENT_PREFIX }}src-tauri/target/release/bundle/**/*.deb
            ${{ env.CLIENT_PREFIX }}src-tauri/target/release/bundle/**/*.dmg
            ${{ env.CLIENT_PREFIX }}src-tauri/target/release/bundle/msi/*.msi
            ${{ env.CLIENT_PREFIX }}src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload server and CLI
        if: inputs.platform != 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lissio-server-cli-${{ inputs.source }}-${{ matrix.runner }}
          path: |
            ${{ env.SERVER_OUTPUT }}/lissio-server${{ runner.os == 'Windows' && '.exe' || '' }}
            ${{ env.SERVER_OUTPUT }}/backend-cli${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload Web frontend
        if: inputs.platform == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lissio-web-${{ inputs.source }}
          path: ${{ env.CLIENT_PREFIX }}dist/
          if-no-files-found: error
